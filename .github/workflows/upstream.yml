name: upstream

# The newest releases of everything setup.py pins, with no pins, so a break upstream shows here before any pin moves.
# Nothing else depends on this workflow, and it runs only on its schedule or by hand, so it blocks nothing. A new release
# that does not work yet is what this is here to find, and the pins keep users on tested versions, so it is not a failure
# of this repository: the run stays green, and a red step inside it says what broke.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest:
    name: newest releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sh .github/scripts/apt_install.sh ffmpeg libgl1
      - name: Newest Python packages, then the quick checks
        run: python .github/scripts/extras_check.py --newest
      - name: Newest playwright-core, then Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright-core@latest
          npx playwright-core install --with-deps chromium
      - name: Newest playwright-core starts Chromium
        run: |
          cd "$RUNNER_TEMP/pw"
          node -e "require('playwright-core').chromium.launch().then(b => b.close())"
