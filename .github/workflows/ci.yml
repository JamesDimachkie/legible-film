name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Python packages
        run: python -m pip install numpy Pillow
      - name: FFmpeg version
        run: ffmpeg -hide_banner -version
      - name: Self-test
        run: python skills/legible-film/scripts/selftest.py

  kit:
    name: kit (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python packages
        run: python -m pip install numpy Pillow
      - name: Playwright and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Kit self-test (capture, motion blur, colour, sizes)
        run: python skills/legible-film/scripts/kit_selftest.py --playwright "$RUNNER_TEMP/pw/node_modules/playwright"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install numpy Pillow
      - name: Links, anchors and scripts named in SKILL.md
        run: python .github/scripts/check_docs.py
      - name: Agent Skills validator
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
          skills-ref validate skills/legible-film
      - name: JSON templates parse
        run: |
          python -c "import json,glob; [json.load(open(p)) for p in glob.glob('skills/legible-film/assets/templates/*.json') + glob.glob('evals/*.json') + glob.glob('.claude-plugin/*.json')]; print('ok')"
